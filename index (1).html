<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newton-Raphson</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 12px; }
    label { display: inline-block; margin: 6px 12px 6px 0; }
    input { padding: 6px; }
    #func { width: 240px; }
    button { padding: 7px 18px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <h2>Newton-Raphson Method</h2>
  <label>f(x): <input id="func" value="x^4 - 11*x + 8"></label>
  <label>x0: <input id="x0" type="number" value="2" step="any"></label>
  <button onclick="solve()">Solve</button>
  <pre id="out"></pre>
  <canvas id="chart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
  let chart = null;

  function solve() {
    const out = document.getElementById("out");
    const funcStr = document.getElementById("func").value;
    const x0 = parseFloat(document.getElementById("x0").value);
    const tol = 1e-4;
    const maxIter = 100;

    try {
      // 1) المعادلة ومشتقتها
      const f = math.compile(funcStr);
      const dfStr = math.derivative(funcStr, "x").toString();
      const df = math.compile(dfStr);
      const F = x => f.evaluate({ x: x });
      const dF = x => df.evaluate({ x: x });

      // 2) حلقة Newton-Raphson
      const xs = [x0];
      let lines = "f'(x) = " + dfStr + "\n\n";
      lines += "Step 0: x = " + x0 + "\n";
      let step = 0;

      while (step < maxIter) {
        const x = xs[xs.length - 1];
        const d = dF(x);
        if (Math.abs(d) < 1e-12) {
          lines += "\nDerivative is zero, can't continue.";
          break;
        }
        const xNew = x - F(x) / d;
        xs.push(xNew);
        step++;
        lines += "Step " + step + ": x = " + xNew + "\n";

        if (Math.abs(xNew - x) < tol) break;
      }

      if (step >= maxIter) lines += "\nMax iterations reached.";

      const root = xs[xs.length - 1];
      lines += "\nNumber of steps: " + step;
      lines += "\nRoot: " + root;
      lines += "\nf(root) = " + F(root);
      out.className = "";
      out.textContent = lines;

      // 3) الرسم
      draw(F, xs);
    } catch (e) {
      out.className = "err";
      out.textContent = "Error: " + e.message;
    }
  }

  function draw(F, xs) {
    const lo = Math.min(...xs), hi = Math.max(...xs);
    const margin = Math.max(1, hi - lo);
    const a = lo - margin, b = hi + margin;
    const n = 300;

    const curve = [];
    for (let i = 0; i <= n; i++) {
      const x = a + (b - a) * i / n;
      const y = F(x);
      if (isFinite(y)) curve.push({ x: x, y: y });
    }
    const pts = xs.map(x => ({ x: x, y: F(x) }));

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), {
      type: "scatter",
      data: {
        datasets: [
          { label: "f(x)", data: curve, showLine: true, pointRadius: 0,
            borderColor: "#2980b9", borderWidth: 2 },
          { label: "Iterations", data: pts, backgroundColor: "red",
            pointRadius: 5 }
        ]
      },
      options: {
        scales: { x: { title: { display: true, text: "x" } },
                  y: { title: { display: true, text: "f(x)" } } }
      }
    });
  }
  </script>
</body>
</html>
